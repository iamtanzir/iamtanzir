<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Stay sharp. Ship fast. Break nothing.">
  
  <defs>
    <pattern id="grid-foot" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00ff88" stroke-width="0.7" opacity="0.05"/>
    </pattern>
    <radialGradient id="glow-foot" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00ff88" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-foot" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1200" height="120" fill="#000000"/>
  <rect width="1200" height="120" fill="url(#grid-foot)"/>
  <ellipse cx="600" cy="120" rx="600" ry="120" fill="url(#glow-foot)"/>
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#0d2c1e"/>
  <text x="600" y="46" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" letter-spacing="7" fill="#00ff88">STAY SHARP · SHIP FAST · BREAK NOTHING</text>
  <text x="600" y="78" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="11" letter-spacing="2.6" fill="#3f6b56">A.K.M TANZIR AHMED · DEVOPS · DHAKA, BANGLADESH · BST UTC+06:00</text>
  <text x="600" y="100" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="10.5" letter-spacing="2.2" fill="#2f5544">$ echo "thanks for stopping by" &amp;&amp; exit 0</text>
</svg>
