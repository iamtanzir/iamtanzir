<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%">
  <defs>
    <!-- Line 1 Mask (Green) -->
    <clipPath id="clip1">
      <rect x="0" y="0" height="100" width="0">
        <animate attributeName="width" 
                 values="0; 800; 800; 0; 0" 
                 keyTimes="0; 0.133; 0.266; 0.333; 1" 
                 dur="15s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Line 2 Mask (Red) -->
    <clipPath id="clip2">
      <rect x="0" y="0" height="100" width="0">
        <animate attributeName="width" 
                 values="0; 0; 800; 800; 0; 0" 
                 keyTimes="0; 0.333; 0.466; 0.599; 0.666; 1" 
                 dur="15s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Line 3 Mask (Blue) -->
    <clipPath id="clip3">
      <rect x="0" y="0" height="100" width="0">
        <animate attributeName="width" 
                 values="0; 0; 800; 800; 0" 
                 keyTimes="0; 0.666; 0.799; 0.932; 1" 
                 dur="15s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- All texts are at the EXACT SAME Position (y="60") -->
  
  <!-- 1st Text (Green) -->
  <g clip-path="url(#clip1)">
    <text x="50%" y="60" font-family="'Fira Code', 'Courier New', monospace" font-weight="bold" font-size="36" text-anchor="middle" fill="#00FF88">CS Engineer | ERP Analyst | Planner</text>
  </g>

  <!-- 2nd Text (Red) -->
  <g clip-path="url(#clip2)">
    <text x="50%" y="60" font-family="'Fira Code', 'Courier New', monospace" font-weight="bold" font-size="36" text-anchor="middle" fill="#FF4444">Cloud | Kubernetes | CI/CD</text>
  </g>

  <!-- 3rd Text (Blue) -->
  <g clip-path="url(#clip3)">
    <text x="50%" y="60" font-family="'Fira Code', 'Courier New', monospace" font-weight="bold" font-size="36" text-anchor="middle" fill="#3B82F6">11+ Years in Apparel ERP</text>
  </g>
</svg>
