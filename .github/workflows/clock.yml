name: Update Live Digital Clock

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *' # refresh every 5 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clock-update
  cancel-in-progress: false

jobs:
  update-clock:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Generate clock SVG and animated GIF
        run: |
          npm run build
          node scripts/gif-clock.mjs
      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/bd-clock.svg assets/bd-clock.gif
          git commit -m "🕐 Auto-update Live Digital Clock" || exit 0
          git push
