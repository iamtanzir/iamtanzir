name: Update Digital Clock SVG

on:
  schedule:
    - cron: '*/15 * * * *' # প্রতি ১৫ মিনিটে আপডেট হবে (SMIL অ্যানিমেশন লাইভ টিকিং হ্যান্ডেল করবে)
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য

permissions:
  contents: write

jobs:
  update-clock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Generate Clock
        run: |
          npm install
          npm run build

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add digital-clock.svg
          git commit -m "🕐 Auto-update Live Digital Clock" || exit 0
          git push
