name: Update Mini Clock SVG (offset 1)

on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clock-update
  cancel-in-progress: false

jobs:
  update-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Clock and bust README cache
        run: |
          node scripts/clock.mjs > assets/bd-clock.svg
          node scripts/bust-cache.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/bd-clock.svg README.md
          git commit -m "🕐 Auto-update Live Digital Clock" || exit 0
          git push
