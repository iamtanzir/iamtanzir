name: Update Dhaka time badge

on:
  schedule:
    # GitHub Actions cron minimum is 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate Dhaka time JSON
        run: node scripts/time-badge.mjs assets/time.json
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/time.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update Dhaka time badge"
            git push
          fi
