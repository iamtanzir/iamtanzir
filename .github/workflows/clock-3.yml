name: Update Mini Clock SVG (offset 3)

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clock-update
  cancel-in-progress: false

jobs:
  update-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate Clock
        run: node scripts/clock.mjs > assets/bd-clock.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/bd-clock.svg
          git commit -m "🕐 Auto-update Live Digital Clock" || exit 0
          git push
